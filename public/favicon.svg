<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="16" fill="#0d0c0a"/>
  <!-- Art Deco double geometric frame -->
  <rect x="10" y="10" width="108" height="108" rx="8" fill="none" stroke="#c9a96e" stroke-width="2.5" opacity="0.85"/>
  <rect x="16" y="16" width="96" height="96" rx="4" fill="none" stroke="#8f6e35" stroke-width="1" opacity="0.6"/>
  <!-- Corner corner accents -->
  <polygon points="10,24 24,10 10,10" fill="#c9a96e"/>
  <polygon points="118,24 104,10 118,10" fill="#c9a96e"/>
  <polygon points="10,104 24,118 10,118" fill="#c9a96e"/>
  <polygon points="118,104 104,118 118,118" fill="#c9a96e"/>
  <!-- Central JR Monogram -->
  <text x="64" y="82" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#c9a96e" text-anchor="middle" letter-spacing="-2">JR</text>
  <!-- Diamond center bottom accent -->
  <polygon points="64,98 68,102 64,106 60,102" fill="#c9a96e"/>
</svg>
